<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Red VPN Ad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070708;
      --red: #e01818;
      --red-bright: #ff2e2e;
      --ink: #f7f7f8;
      --muted: #b4b4bb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: var(--bg); color: var(--ink);
      font-family: "Manrope", sans-serif;
    }
    .stage {
      position: relative; width: 1080px; height: 1920px; overflow: hidden;
      background:
        radial-gradient(ellipse 100% 60% at 50% 12%, rgba(224,24,24,0.34), transparent 58%),
        radial-gradient(ellipse 80% 45% at 50% 100%, rgba(224,24,24,0.16), transparent 55%),
        linear-gradient(180deg, #121214 0%, #070708 48%, #050505 100%);
    }
    .grain {
      position: absolute; inset: 0; opacity: 0.07; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }
    .orbit {
      position: absolute; left: 50%; top: 36%;
      width: 620px; height: 620px; border-radius: 50%;
      border: 1px solid rgba(224,24,24,0.22);
      transform: translate(-50%, -50%);
      animation: spin 18s linear infinite;
    }
    .orbit::before, .orbit::after {
      content: ""; position: absolute; border-radius: 50%;
      border: 1px solid rgba(224,24,24,0.18);
    }
    .orbit::before { inset: 48px; }
    .orbit::after { inset: 104px; border-style: dashed; }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    .pulse {
      position: absolute; left: 50%; top: 36%;
      width: 420px; height: 420px; border-radius: 50%;
      border: 2px solid rgba(255,46,46,0.35);
      transform: translate(-50%, -50%) scale(0.7);
      opacity: 0;
      animation: pulse 2.8s ease-out infinite;
    }
    .pulse.d2 { animation-delay: 0.9s; }
    .pulse.d3 { animation-delay: 1.8s; }
    @keyframes pulse {
      0% { opacity: 0.55; transform: translate(-50%, -50%) scale(0.65); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.45); }
    }

    .scene {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 96px 70px;
      opacity: 0; pointer-events: none;
    }

    /* ~22s voiceover sync */
    .s1 { animation: scene 4.2s cubic-bezier(.16,1,.3,1) both; animation-delay: 0s; }
    .s2 { animation: scene 4.6s cubic-bezier(.16,1,.3,1) both; animation-delay: 3.9s; }
    .s3 { animation: scene 5.8s cubic-bezier(.16,1,.3,1) both; animation-delay: 8.2s; }
    .s4 { animation: scene 8.2s cubic-bezier(.16,1,.3,1) both; animation-delay: 13.6s; }

    @keyframes scene {
      0% { opacity: 0; transform: translateY(36px) scale(0.97); filter: blur(6px); }
      10% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      84% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      100% { opacity: 0; transform: translateY(-22px) scale(1.02); filter: blur(4px); }
    }

    .logo {
      width: 380px; height: auto; margin-bottom: 42px;
      filter: drop-shadow(0 0 36px rgba(224,24,24,0.5));
      animation: breathe 2.6s ease-in-out infinite 0.8s;
    }
    .logo.sm { width: 220px; margin-bottom: 28px; }
    @keyframes breathe {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 28px rgba(224,24,24,0.4)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 52px rgba(255,46,46,0.6)); }
    }

    .brand {
      font-family: "Unbounded", sans-serif;
      font-weight: 800; font-size: 118px; letter-spacing: -0.04em; line-height: 0.95;
    }
    .brand em { font-style: normal; color: var(--red-bright); }

    .tag {
      margin-top: 26px; font-size: 34px; font-weight: 600; color: var(--muted);
      letter-spacing: 0.01em; max-width: 820px; line-height: 1.35;
    }

    .headline {
      font-family: "Unbounded", sans-serif;
      font-weight: 700; font-size: 78px; line-height: 1.06;
      letter-spacing: -0.035em; max-width: 900px;
    }

    .price {
      font-family: "Unbounded", sans-serif;
      font-weight: 800; font-size: 132px; letter-spacing: -0.045em; line-height: 1;
    }
    .price em { font-style: normal; color: var(--red-bright); font-size: 0.7em; }
    .price-sub { margin-top: 16px; font-size: 34px; color: var(--muted); font-weight: 600; }
    .line {
      width: 140px; height: 3px; margin: 42px 0;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
    }
    .alt {
      font-family: "Unbounded", sans-serif;
      font-weight: 700; font-size: 52px; letter-spacing: -0.03em; line-height: 1.2;
    }
    .alt strong { color: var(--red-bright); }
    .hint { margin-top: 14px; font-size: 30px; color: var(--muted); font-weight: 600; }

    .cta-title {
      font-family: "Unbounded", sans-serif;
      font-weight: 700; font-size: 52px; letter-spacing: -0.03em; margin-bottom: 28px;
    }
    .handle {
      font-family: "Unbounded", sans-serif;
      font-weight: 800; font-size: 58px; color: var(--red-bright);
      letter-spacing: -0.02em; padding: 26px 40px;
      border: 2px solid rgba(224,24,24,0.6);
      background: rgba(224,24,24,0.12);
      animation: glow 1.5s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 rgba(224,24,24,0); transform: scale(1); }
      50% { box-shadow: 0 0 36px rgba(224,24,24,0.35); transform: scale(1.025); }
    }
    .cta-note { margin-top: 28px; font-size: 30px; color: var(--muted); font-weight: 600; }

    .mark {
      position: absolute; bottom: 64px; left: 0; right: 0; text-align: center;
      font-family: "Unbounded", sans-serif; font-size: 20px;
      letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.32);
      animation: fade 1s ease 0.8s both;
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .scan {
      position: absolute; left: 0; right: 0; height: 160px; pointer-events: none;
      background: linear-gradient(180deg, transparent, rgba(224,24,24,0.07), transparent);
      animation: scan 5s linear infinite; mix-blend-mode: screen;
    }
    @keyframes scan { from { top: -160px; } to { top: 100%; } }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="grain"></div>
    <div class="orbit"></div>
    <div class="pulse"></div>
    <div class="pulse d2"></div>
    <div class="pulse d3"></div>
    <div class="scan"></div>

    <section class="scene s1">
      <img class="logo" src="assets/logo.png" alt="Red VPN" />
      <h1 class="brand">RED <em>VPN</em></h1>
      <p class="tag">Защита. Скорость. Свобода сети.</p>
    </section>

    <section class="scene s2">
      <h2 class="headline">Быстрый и<br/>безопасный<br/>интернет</h2>
      <p class="tag" style="margin-top:28px">Стабильный доступ без лишней сложности</p>
    </section>

    <section class="scene s3">
      <div class="price">от 89<em>₽</em></div>
      <div class="price-sub">в месяц — для всех</div>
      <div class="line"></div>
      <div class="alt">с друзьями — <strong>от 79₽</strong></div>
      <div class="hint">чем больше друзей, тем выгоднее</div>
    </section>

    <section class="scene s4">
      <img class="logo sm" src="assets/logo.png" alt="" />
      <div class="cta-title">Подключайся в Telegram</div>
      <div class="handle">@redbotvpn_bot</div>
      <div class="cta-note">Red VPN — тарифы от 79₽/мес</div>
    </section>

    <div class="mark">Red VPN</div>
  </div>
</body>
</html>
