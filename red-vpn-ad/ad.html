<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Red VPN Ad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0b;
      --red: #e11d1d;
      --red-soft: #ff3b3b;
      --ink: #f5f5f5;
      --muted: #b8b8bc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Manrope", sans-serif;
    }

    .stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 90% 55% at 50% 18%, rgba(225, 29, 29, 0.28), transparent 60%),
        radial-gradient(ellipse 70% 40% at 50% 100%, rgba(225, 29, 29, 0.14), transparent 55%),
        linear-gradient(180deg, #101012 0%, #070708 55%, #050505 100%);
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.08;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
      animation: grainShift 8s linear infinite;
    }

    @keyframes grainShift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-2%, 2%); }
    }

    .pulse-ring {
      position: absolute;
      left: 50%;
      top: 34%;
      width: 520px;
      height: 520px;
      border: 2px solid rgba(225, 29, 29, 0.35);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      animation: ringPulse 3.2s ease-out infinite;
    }
    .pulse-ring.d2 { animation-delay: 1.05s; }
    .pulse-ring.d3 { animation-delay: 2.1s; }

    @keyframes ringPulse {
      0% { opacity: 0.55; transform: translate(-50%, -50%) scale(0.55); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.35); }
    }

    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 72px;
      opacity: 0;
      pointer-events: none;
    }

    /* Scene timings for ~20s total */
    .s1 { animation: fadeScene 3.8s ease both; animation-delay: 0s; }
    .s2 { animation: fadeScene 4.2s ease both; animation-delay: 3.5s; }
    .s3 { animation: fadeScene 5.4s ease both; animation-delay: 7.4s; }
    .s4 { animation: fadeScene 7.2s ease both; animation-delay: 12.5s; }

    @keyframes fadeScene {
      0% { opacity: 0; transform: translateY(28px) scale(0.98); }
      8% { opacity: 1; transform: translateY(0) scale(1); }
      82% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-18px) scale(1.02); }
    }

    .logo-wrap {
      position: relative;
      width: 420px;
      height: 420px;
      display: grid;
      place-items: center;
      margin-bottom: 48px;
      animation: logoIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.72); filter: blur(8px); }
      to { opacity: 1; transform: scale(1); filter: blur(0); }
    }

    .logo-wrap img {
      width: 360px;
      height: auto;
      filter: drop-shadow(0 0 40px rgba(225, 29, 29, 0.45));
      animation: logoBreath 2.8s ease-in-out infinite 1.2s;
    }

    @keyframes logoBreath {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 30px rgba(225, 29, 29, 0.35)); }
      50% { transform: scale(1.035); filter: drop-shadow(0 0 55px rgba(255, 59, 59, 0.55)); }
    }

    .brand {
      font-family: "Unbounded", sans-serif;
      font-weight: 800;
      font-size: 108px;
      letter-spacing: -0.03em;
      line-height: 0.95;
      color: var(--ink);
      text-shadow: 0 0 40px rgba(225, 29, 29, 0.35);
    }

    .brand span { color: var(--red-soft); }

    .tag {
      margin-top: 28px;
      font-size: 36px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.02em;
      max-width: 820px;
      line-height: 1.35;
    }

    .headline {
      font-family: "Unbounded", sans-serif;
      font-weight: 700;
      font-size: 72px;
      line-height: 1.08;
      letter-spacing: -0.03em;
      max-width: 900px;
    }

    .sub {
      margin-top: 28px;
      font-size: 34px;
      color: var(--muted);
      font-weight: 600;
      max-width: 780px;
      line-height: 1.4;
    }

    .prices {
      display: flex;
      flex-direction: column;
      gap: 36px;
      width: 100%;
      max-width: 860px;
      align-items: center;
    }

    .price-main {
      font-family: "Unbounded", sans-serif;
      font-weight: 800;
      font-size: 120px;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--ink);
    }

    .price-main em {
      font-style: normal;
      color: var(--red-soft);
      font-size: 0.72em;
    }

    .price-label {
      margin-top: 14px;
      font-size: 32px;
      color: var(--muted);
      font-weight: 600;
    }

    .divider {
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
      border-radius: 2px;
      opacity: 0.8;
    }

    .price-alt {
      font-family: "Unbounded", sans-serif;
      font-weight: 700;
      font-size: 64px;
      letter-spacing: -0.03em;
    }

    .price-alt strong { color: var(--red-soft); }

    .friend-note {
      margin-top: 12px;
      font-size: 30px;
      color: var(--muted);
      font-weight: 600;
    }

    .cta-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .cta-title {
      font-family: "Unbounded", sans-serif;
      font-weight: 700;
      font-size: 56px;
      letter-spacing: -0.03em;
    }

    .handle {
      font-family: "Unbounded", sans-serif;
      font-weight: 800;
      font-size: 64px;
      color: var(--red-soft);
      letter-spacing: -0.02em;
      padding: 28px 44px;
      border: 2px solid rgba(225, 29, 29, 0.55);
      background: rgba(225, 29, 29, 0.1);
      animation: handlePulse 1.6s ease-in-out infinite;
    }

    @keyframes handlePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(225, 29, 29, 0.0); transform: scale(1); }
      50% { box-shadow: 0 0 0 18px rgba(225, 29, 29, 0.0), 0 0 40px rgba(225, 29, 29, 0.35); transform: scale(1.02); }
    }

    .cta-note {
      font-size: 30px;
      color: var(--muted);
      font-weight: 600;
    }

    .footer-mark {
      position: absolute;
      bottom: 64px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: "Unbounded", sans-serif;
      font-size: 22px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      opacity: 0;
      animation: fadeIn 1s ease 1s both;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .scan {
      position: absolute;
      left: 0;
      right: 0;
      height: 180px;
      background: linear-gradient(180deg, transparent, rgba(225,29,29,0.08), transparent);
      animation: scanMove 4.5s linear infinite;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    @keyframes scanMove {
      0% { top: -180px; }
      100% { top: 100%; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="grain"></div>
    <div class="scan"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring d2"></div>
    <div class="pulse-ring d3"></div>

    <section class="scene s1">
      <div class="logo-wrap">
        <img src="assets/logo.png" alt="Red VPN" />
      </div>
      <h1 class="brand">RED <span>VPN</span></h1>
      <p class="tag">Защита. Скорость. Свобода сети.</p>
    </section>

    <section class="scene s2">
      <h2 class="headline">Быстрый и<br/>безопасный<br/>интернет</h2>
      <p class="sub">Стабильный доступ без лишней сложности</p>
    </section>

    <section class="scene s3">
      <div class="prices">
        <div>
          <div class="price-main">от 89<em>₽</em></div>
          <div class="price-label">в месяц — для всех</div>
        </div>
        <div class="divider"></div>
        <div>
          <div class="price-alt">с друзьями — <strong>от 79₽</strong></div>
          <div class="friend-note">чем больше друзей, тем выгоднее</div>
        </div>
      </div>
    </section>

    <section class="scene s4">
      <div class="cta-box">
        <div class="logo-wrap" style="width:280px;height:280px;margin-bottom:8px">
          <img src="assets/logo.png" alt="" style="width:240px" />
        </div>
        <h2 class="cta-title">Подключайся в Telegram</h2>
        <div class="handle">@redbotvpn_bot</div>
        <p class="cta-note">Red VPN — тарифы от 79₽/мес</p>
      </div>
    </section>

    <div class="footer-mark">Red VPN</div>
  </div>
</body>
</html>
