<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Red VPN — реклама</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#09090b; --red:#e11d1d; --ink:#f5f5f5; --muted:#a1a1aa; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Manrope, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(225,29,29,.28), transparent 55%),
        var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 64px;
    }
    header { text-align: center; margin-bottom: 28px; }
    header img { width: 72px; height: auto; margin-bottom: 14px; filter: drop-shadow(0 0 18px rgba(225,29,29,.45)); }
    h1 { font-family: Unbounded, sans-serif; font-size: clamp(28px, 5vw, 42px); font-weight: 800; letter-spacing: -.03em; }
    h1 span { color: #ff3b3b; }
    p { margin-top: 10px; color: var(--muted); }
    .player {
      width: min(420px, 100%);
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 20px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(225,29,29,.25);
    }
    video { width: 100%; display: block; aspect-ratio: 9/16; background: #000; }
    .links {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      background: var(--red);
      color: #fff;
    }
    a.btn.secondary { background: transparent; border: 1px solid rgba(255,255,255,.2); color: var(--ink); }
    .note { margin-top: 18px; font-size: 13px; color: var(--muted); text-align: center; max-width: 420px; }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Red VPN" />
    <h1>RED <span>VPN</span></h1>
    <p>Рекламный ролик со звуком · ~19 сек</p>
  </header>
  <div class="player">
    <video controls playsinline preload="metadata" poster="">
      <source src="RedVPN_ad_9x16.mp4" type="video/mp4" />
    </video>
  </div>
  <div class="links">
    <a class="btn" href="RedVPN_ad_9x16.mp4" download>Скачать 9:16</a>
    <a class="btn secondary" href="RedVPN_ad_16x9.mp4" download>Скачать 16:9</a>
    <a class="btn secondary" href="RedVPN_ad_9x16_music.mp4" download>Без голоса</a>
    <a class="btn secondary" href="RedVPN_audio_only.mp3" download>Только звук</a>
  </div>
  <p class="note">Включи звук в плеере. Бот: @redbotvpn_bot · от 89₽/мес, с друзьями от 79₽</p>
</body>
</html>
